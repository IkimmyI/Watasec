<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Watasec — Cyber Anime Zone</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #030712;
      --bg2: #060b1c;
      --card: #0a0f24;
      --accent: #ff6ee6;
      --neon: #00f3ff;
      --text: #e8f3ff;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      font-family: 'Share Tech Mono', monospace;
      background: radial-gradient(circle at 30% 20%, #0d152e, #030712 70%);
      color: var(--text);
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 40px 0;
      color: var(--neon);
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding: 0 40px 100px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.08);
      cursor: pointer;
      transform: scale(0.9);
      opacity: 0;
      transition: transform 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(255, 111, 247, 0.4);
    }

    .cover {
      height: 150px;
      background-size: cover;
      background-position: center;
      filter: brightness(0.8);
    }

    .meta {
      padding: 15px;
    }

    .meta h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--neon);
      text-shadow: 0 0 6px var(--neon);
    }

    .meta .muted {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .excerpt {
      color: var(--text);
      margin-top: 10px;
      font-size: 0.9rem;
    }

    /* Floating anime gif */
    .anime-float {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 111, 247, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }

    .anime-float img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Neon glow effect on hover */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255,111,247,0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card:hover::after { opacity: 1; }

  </style>
</head>
<body>
  <header id="title">Watasec — Anime SOC Logs</header>

  <main>
    <div class="grid" id="cards"></div>
  </main>

  <div class="anime-float" id="animeBox">
    <img src="./anime.gif" alt="anime girl">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const cardsEl = document.getElementById('cards');

    // Example post data (you can replace with posts.json fetch)
    const posts = [
      { title: "LOLBAS: Living off the Land Attacks", date: "2025-10-19", excerpt: "Understanding how attackers weaponize trusted binaries.", cover: "https://i.imgur.com/Nr0wz1M.jpeg" },
      { title: "SOC Automation with Wazuh + Shuffle", date: "2025-10-12", excerpt: "How to build automated incident workflows for detection & response.", cover: "https://i.imgur.com/j1qOjqk.jpeg" },
      { title: "Memory Forensics in Action", date: "2025-10-05", excerpt: "Using Volatility 3 to detect stealthy persistence mechanisms.", cover: "https://i.imgur.com/IcOaD6b.jpeg" }
    ];

    // Create cards
    posts.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="cover" style="background-image:url('${p.cover}')"></div>
        <div class="meta">
          <h3>${p.title}</h3>
          <div class="muted">${p.date}</div>
          <div class="excerpt">${p.excerpt}</div>
        </div>`;
      cardsEl.appendChild(card);
    });

    // Animate cards entrance
    anime({
      targets: '.card',
      opacity: [0, 1],
      scale: [0.9, 1],
      translateY: [40, 0],
      delay: anime.stagger(200, { start: 500 }),
      duration: 1000,
      easing: 'easeOutElastic(1, .8)'
    });

    // Title glow animation loop
    anime({
      targets: '#title',
      textShadow: [
        { value: '0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #ff6ee6' },
        { value: '0 0 3px #ff6ee6, 0 0 15px #ff6ee6, 0 0 30px #00f3ff' }
      ],
      direction: 'alternate',
      duration: 2500,
      loop: true,
      easing: 'easeInOutSine'
    });

    // Floating anime gif idle animation
    anime({
      targets: '#animeBox',
      translateY: [
        { value: -12, duration: 2000, easing: 'easeInOutSine' },
        { value: 0, duration: 2000, easing: 'easeInOutSine' }
      ],
      loop: true
    });

  </script>
</body>
</html>
